<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Dragon Bites - Restaurants</title>
    <link rel="stylesheet" href="restaurant-filters.css">
</head>
<body>
    <header>
        <aside class="head-above">
        </aside>
    </header>
    
    <nav>
        <ul>
            <li><a href="#">Free events</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Meal Mapper</a></li>
            <li><a href="#">Restaurants</a></li>
        </ul>
    </nav>
    
    <h3 align="center">Affordable, free and campus approved food spots for Drexel Students</h3>
    
    <div class="main-wrapper">
        <aside class="restaurant-filter-sidebar">
            <div class="restaurant-filter-header">
                <h3 class="restaurant-filter-title">FILTERS</h3>
                <button class="restaurant-filter-clear">Clear All</button>
            </div>
            <hr>
            
            <div class="restaurant-filter-section">
                <h4>Payment Methods</h4>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Dragon Dollars
                </label>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Dining Dollars
                </label>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Card
                </label>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Cash
                </label>
            </div>
            <hr>
            
            <div class="restaurant-filter-section">
                <h4>Dietary Options</h4>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Vegetarian
                </label>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Halal
                </label>
            </div>
            <hr>
            
            <div class="restaurant-filter-section">
                <h4>Food Events</h4>
                <label class="restaurant-filter-label">
                    <input type="checkbox"> Free Food Events
                </label>
            </div>
            <hr>
            
            <div class="restaurant-filter-section">
                <h4>Price Range</h4>
                <div class="price-inputs">
                    <input type="number" placeholder="Min $" min="0">
                    <span>-</span>
                    <input type="number" placeholder="Max $" min="0">
                </div>
            </div>
            <hr>
            
            <button class="restaurant-filter-apply">Apply Filters</button>
        </aside>
    </div>
</body>
</html>
